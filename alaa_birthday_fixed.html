<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد يا ألاء 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2c1630 0%, #0f0812 100%);
            color: #fce4ec;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* Floating background elements */
        .particle {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 680px;
            width: 90%;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 105, 180, 0.1);
            animation: fadeIn 1.5s ease-out;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: #ff94b8;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 148, 184, 0.4);
            font-weight: 700;
        }

        /* Cake Styling */
        .cake-container {
            margin: 15px auto;
            position: relative;
            width: 160px;
            height: 140px;
            cursor: pointer;
        }

        .plate {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 10px;
            background: #e0e0e0;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px;
        }

        .layer-bottom {
            bottom: 10px;
            width: 130px;
            height: 45px;
            background: linear-gradient(135deg, #e91e63, #ad1457);
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
        }

        .layer-top {
            bottom: 55px;
            width: 100px;
            height: 40px;
            background: linear-gradient(135deg, #ff4081, #c51162);
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
        }

        .icing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background: #fff;
            border-radius: 8px 8px 4px 4px;
        }

        .candle {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 35px;
            background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff4081 5px, #ff4081 10px);
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 20px;
            background: radial-gradient(circle at 50% 70%, #ffeb3b 0%, #ff5722 70%, rgba(255,152,0,0) 100%);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.6s infinite alternate;
            box-shadow: 0 0 10px #ff9800, 0 0 18px #ffeb3b;
        }

        .flame.extinguished {
            display: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.1) rotate(3deg); opacity: 1; }
        }

        .message {
            font-family: 'Amiri', serif;
            font-size: 1.25rem;
            line-height: 1.8;
            color: #f8bbd0;
            margin: 15px 0;
            white-space: pre-line;
            font-weight: 400;
        }

        .signature {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            color: #ffd1dc;
            margin-top: 10px;
            font-weight: 700;
        }

        .btn {
            background: linear-gradient(135deg, #ff4081, #c51162);
            color: white;
            border: none;
            padding: 8px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 64, 129, 0.4);
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 64, 129, 0.6);
            background: linear-gradient(135deg, #ff6090, #d81b60);
        }

        .footer-note {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #d1c4e9;
            font-style: italic;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <div class="title">لحبيبة قلبي وروحي وشريكة عمري الآء</div>

        <div class="cake-container" id="cake" title="انقر لإطفاء الشمعة!">
            <div class="plate"></div>
            <div class="layer layer-bottom"></div>
            <div class="layer layer-top">
                <div class="icing"></div>
            </div>
            <div class="candle">
                <div class="flame" id="flame"></div>
            </div>
        </div>

        <div class="message">
كل عام وانتي بخير 
كل عام وحياتك مليانة حب وسعادة
كل عام وانتي حبيبتي كل عام وانتي شريكتي كل عام وانتي سندي 
وإن شاء الله سنة تحقق فيها كل أحلامك
        </div>

        <div class="signature">عمر</div>

        <button class="btn" onclick="celebrate()">مفاجأة الاحتفال 🎉</button>

        <div class="footer-note" id="hint">انقر على الكعكة لإطفاء الشمعة! 🎂</div>
    </div>

    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // Initialize confetti with dedicated canvas to prevent mobile viewport jitter/shaking
        const myConfetti = confetti.create(document.getElementById('confetti-canvas'), {
            resize: true,
            useWorker: true
        });

        // Floating particles (Hearts and Flowers)
        const symbols = ['💖', '🌸', '✨', '🌷', '💕', '🌹', '❤️'];
        
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            particle.style.left = Math.random() * 95 + 'vw';
            particle.style.fontSize = (Math.random() * 16 + 14) + 'px';
            
            const duration = Math.random() * 3 + 4;
            particle.style.animationDuration = duration + 's';
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, duration * 1000);
        }

        setInterval(createParticle, 350);

        // Cake candle interaction
        const cake = document.getElementById('cake');
        const flame = document.getElementById('flame');
        const hint = document.getElementById('hint');
        let blown = false;

        cake.addEventListener('click', () => {
            if (!blown) {
                flame.classList.add('extinguished');
                blown = true;
                hint.innerHTML = "واو! إن شاء الله كل أمنياتك بتتحقق! 🎂✨";
                
                // Trigger celebratory confetti
                myConfetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                flame.classList.remove('extinguished');
                blown = false;
                hint.innerHTML = "رجعت ضويت الشمعة! انقر مرة تانية لتطفيها.";
            }
        });

        function celebrate() {
            myConfetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.5 }
            });
        }
    </script>
</body>
</html>
